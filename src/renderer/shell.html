<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>aqw-elec</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d0d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    /* ── Unified Frameless Title & Tab Bar ────────────────── */
    #tab-bar {
      display: flex;
      align-items: center;
      height: 38px;
      background: #111118;
      border-bottom: 1px solid #222232;
      padding-left: 10px;
      gap: 6px;
      -webkit-app-region: drag; /* Native window dragging! */
    }

    #app-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #d4af37;
      margin-right: 6px;
      -webkit-app-region: no-drag;
      cursor: default;
    }

    #tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-app-region: no-drag;
    }
    #tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px 0 12px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 12px;
      color: #777;
      background: #161622;
      border: 1px solid #242436;
      border-bottom: none;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      min-width: 90px;
      max-width: 160px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .tab:hover { background: #202032; color: #ccc; }

    .tab.active {
      background: #1a1a2e;
      color: #d4af37;
      border-color: #383854;
      font-weight: 500;
    }

    .tab-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      width: 16px; height: 16px;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }
    .tab-close:hover { background: #c0392b; color: #fff; }

    #btn-add {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid #242436;
      background: #161622;
      color: #777;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    #btn-add:hover { background: #202032; color: #d4af37; }

    /* Drag Spacer between tabs and controls */
    .drag-spacer {
      flex: 1;
      height: 100%;
      -webkit-app-region: drag;
    }

    /* ── Right Controls ──────────────────────────────────── */
    #controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .ctrl-btn {
      height: 26px;
      padding: 0 12px;
      border-radius: 5px;
      border: 1px solid #242436;
      background: #161622;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }
    .ctrl-btn:hover { background: #202032; color: #ccc; border-color: #383854; }
    .ctrl-btn.active { background: #1c2b45; color: #5dade2; border-color: #2e4a70; }

    /* ── Native Window Controls ──────────────────────────── */
    #win-controls {
      display: flex;
      align-items: center;
      height: 100%;
      margin-left: 6px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 44px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #777;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
    }
    .win-btn:hover {
      background: #202032;
      color: #fff;
    }
    .win-btn.close:hover {
      background: #c0392b;
      color: #fff;
    }

    /* ── Content Area ────────────────────────────────────── */
    #content {
      position: absolute;
      top: 38px; left: 0; right: 0; bottom: 0;
      background: #000;
    }

    /* ── Tab Panes: Tab View (one visible at a time) ─────── */
    .tab-pane {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      visibility: hidden;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .tab-pane.active {
      visibility: visible;
      pointer-events: auto;
    }

    .pane-header {
      display: none;
      height: 24px;
      background: #12121c;
      border-bottom: 1px solid #222232;
      padding: 0 8px;
      font-size: 11px;
      color: #888;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .pane-header .title { font-weight: 500; color: #d4af37; }

    .tab-pane webview {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    /* ── Tab Panes: Grid View (all visible side by side) ── */
    #content.grid-view {
      display: grid;
      grid-template-columns: repeat(var(--cols, 2), 1fr);
      grid-template-rows: repeat(var(--rows, 1), 1fr);
      gap: 3px;
      background: #0d0d14;
      padding: 3px;
    }

    #content.grid-view .tab-pane {
      position: relative !important;
      visibility: visible !important;
      pointer-events: auto !important;
      width: 100% !important;
      height: 100% !important;
      border: 1px solid #222232;
      border-radius: 4px;
      overflow: hidden;
    }
    #content.grid-view .tab-pane.active {
      border-color: #d4af37;
    }

    #content.grid-view .pane-header {
      display: flex;
    }

    /* ── Empty state ─────────────────────────────────────── */
    #empty {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #333;
      text-align: center;
      pointer-events: none;
    }
    #empty .big { font-size: 48px; margin-bottom: 8px; }
    #empty .msg { font-size: 13px; color: #333344; }
  </style>
</head>
<body>

  <!-- Unified Frameless Title & Tab Bar -->
  <div id="tab-bar">
    <div id="app-brand">⚔ aqw-elec</div>
    <div id="tabs"></div>
    <button id="btn-add" title="New client (Ctrl+T)">+</button>
    <div class="drag-spacer"></div>
    <div id="controls">
      <button class="ctrl-btn" id="btn-grid" title="Toggle grid view (Ctrl+G)">
        <span id="grid-icon">⊞</span>
        <span id="grid-label">Grid View</span>
      </button>
    </div>
    <div id="win-controls">
      <button class="win-btn" id="win-min" title="Minimize">&#8212;</button>
      <button class="win-btn" id="win-max" title="Maximize">&#9633;</button>
      <button class="win-btn close" id="win-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Content Container -->
  <div id="content">
    <div id="empty">
      <div class="big">⚔</div>
      <div class="msg">Press + or Ctrl+T to open a client</div>
    </div>
  </div>

  <script>
    const content   = document.getElementById('content');
    const tabsEl    = document.getElementById('tabs');
    const btnAdd    = document.getElementById('btn-add');
    const btnGrid   = document.getElementById('btn-grid');
    const gridLabel = document.getElementById('grid-label');
    const gridIcon  = document.getElementById('grid-icon');
    const emptyEl   = document.getElementById('empty');

    const GAME_URL = 'http://127.0.0.1:8080/index.html';

    let tabs = [];        // [{ id, label, pane, webview, tabEl }]
    let activeId = null;
    let gridMode = false;

    // ── Get lowest available tab ID (resets to 1 when empty, fills holes) ─
    function getNextId() {
      const used = new Set(tabs.map(t => t.id));
      let id = 1;
      while (used.has(id)) {
        id++;
      }
      return id;
    }

    // ── Create a new tab ─────────────────────────────────
    function createTab() {
      const id = getNextId();
      const label = `Client ${id}`;

      // Tab element in bar
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.innerHTML = `
        <span class="tab-label">${label}</span>
        <span class="tab-close" data-id="${id}" title="Close">✕</span>
      `;
      tabEl.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-close')) {
          closeTab(id);
        } else {
          setActive(id);
        }
      });
      tabsEl.appendChild(tabEl);

      // Pane wrapper with header & webview
      const pane = document.createElement('div');
      pane.className = 'tab-pane';
      pane.dataset.id = id;

      const header = document.createElement('div');
      header.className = 'pane-header';
      header.innerHTML = `<span class="title">⚔ ${label}</span>`;
      header.addEventListener('click', () => setActive(id));

      const wv = document.createElement('webview');
      wv.setAttribute('src', `${GAME_URL}?tabId=${id}`);
      wv.setAttribute('plugins', '');
      wv.setAttribute('allowpopups', '');
      wv.setAttribute('webpreferences', 'plugins=1, javascript=1, allowRunningInsecureContent=1, webSecurity=0');

      pane.appendChild(header);
      pane.appendChild(wv);
      content.appendChild(pane);

      const tab = { id, label, pane, webview: wv, tabEl };
      tabs.push(tab);

      updateEmpty();
      setActive(id);
      updateGrid();

      // Scroll tabs bar to reveal new tab
      tabsEl.scrollLeft = tabsEl.scrollWidth;

      return tab;
    }

    // ── Activate a tab ───────────────────────────────────
    function setActive(id) {
      activeId = id;
      tabs.forEach(t => {
        const isThis = (t.id === id);
        t.tabEl.classList.toggle('active', isThis);
        t.pane.classList.toggle('active', isThis);
      });
    }

    // ── Close a tab ──────────────────────────────────────
    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const tab = tabs[idx];

      tab.tabEl.remove();
      tab.pane.remove();
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        activeId = null;
      } else if (activeId === id) {
        const newActive = tabs[Math.min(idx, tabs.length - 1)];
        setActive(newActive.id);
      }

      updateEmpty();
      updateGrid();
    }

    // ── Grid View Toggle ─────────────────────────────────
    function toggleGrid() {
      gridMode = !gridMode;
      btnGrid.classList.toggle('active', gridMode);
      gridLabel.textContent = gridMode ? 'Tab View' : 'Grid View';
      gridIcon.textContent  = gridMode ? '▣' : '⊞';
      content.classList.toggle('grid-view', gridMode);
      updateGrid();
    }

    // ── Calculate dynamic grid columns/rows ──────────────
    function updateGrid() {
      const n = tabs.length;
      let cols, rows;
      if (n <= 1)      { cols = 1; rows = 1; }
      else if (n <= 2) { cols = 2; rows = 1; }
      else if (n <= 4) { cols = 2; rows = 2; }
      else if (n <= 6) { cols = 3; rows = 2; }
      else if (n <= 9) { cols = 3; rows = 3; }
      else             { cols = 4; rows = Math.ceil(n / 4); }
      content.style.setProperty('--cols', cols);
      content.style.setProperty('--rows', rows);
    }

    // ── Empty state toggle ───────────────────────────────
    function updateEmpty() {
      emptyEl.style.display = tabs.length === 0 ? 'block' : 'none';
    }

    // ── Keyboard shortcuts ───────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 't') { e.preventDefault(); createTab(); }
      if (e.ctrlKey && e.key === 'g') { e.preventDefault(); toggleGrid(); }
      if (e.ctrlKey && e.key === 'w') { e.preventDefault(); if (activeId != null) closeTab(activeId); }
      const n = parseInt(e.key);
      if (e.ctrlKey && n >= 1 && n <= 9 && tabs[n - 1]) {
        e.preventDefault();
        setActive(tabs[n - 1].id);
      }
    });

    // ── Button bindings ──────────────────────────────────
    btnAdd.addEventListener('click', () => createTab());
    btnGrid.addEventListener('click', () => toggleGrid());

    // ── Window Controls IPC ──────────────────────────────
    try {
      const { ipcRenderer } = require('electron');
      const winMin = document.getElementById('win-min');
      const winMax = document.getElementById('win-max');
      const winClose = document.getElementById('win-close');

      winMin.addEventListener('click', () => ipcRenderer.send('window-minimize'));
      winMax.addEventListener('click', () => ipcRenderer.send('window-maximize'));
      winClose.addEventListener('click', () => ipcRenderer.send('window-close'));

      ipcRenderer.on('window-is-maximized', (event, isMax) => {
        winMax.innerHTML = isMax ? '&#10065;' : '&#9633;';
      });
    } catch (_) {}

    // ── Init: open first tab automatically ──────────────
    createTab();
  </script>
</body>
</html>
