<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AQWorlds - aqw-elec</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    embed {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // Read tabId from URL query (?tabId=1) to tag Flash connection
    const urlParams = new URLSearchParams(window.location.search);
    const tabId = urlParams.get('tabId') || '1';

    const container = document.getElementById('game-container');
    const embed = document.createElement('embed');
    embed.id = 'flash-game';
    embed.type = 'application/x-shockwave-flash';
    embed.src = 'bridge.swf';
    embed.width = '100%';
    embed.height = '100%';
    embed.setAttribute('allowscriptaccess', 'always');
    embed.setAttribute('allownetworking', 'all');
    embed.setAttribute('wmode', 'opaque');
    embed.setAttribute('flashvars', `autostart=true&clientId=tab-${tabId}`);
    container.appendChild(embed);
  </script>
</body>
</html>
